name: Sonde des sources de la bibliothèque

on:
  push:
    paths:
      - ".github/workflows/sonde-bibliotheque.yml"
  workflow_dispatch:

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Format de l'export CirrusSearch et débit
        run: |
          set +e
          UA="MiradorSI-bibliotheque/0.4 (construction d'un index hors ligne)"
          F="https://dumps.wikimedia.org/other/cirrussearch/20251229/frwiki-20251229-cirrussearch-content.json.gz"
          echo "== débit (40 s)"; timeout 40 curl -s -A "$UA" -o /dev/null -w "%{speed_download} octets/s\n" "$F"
          for M in https://mirror.accum.se/mirror/wikimedia.org/other/cirrussearch/20251229/ https://ftp.acc.umu.se/mirror/wikimedia.org/other/cirrussearch/20251229/; do
            echo "== miroir $M"; curl -s -m 20 "$M" | grep -o 'frwiki-20251229-cirrussearch-content[^"<]*' | head -2
            timeout 30 curl -s -o /dev/null -w "%{speed_download} octets/s\n" "${M}frwiki-20251229-cirrussearch-content.json.gz"
          done
          echo "== documents"
          curl -s -A "$UA" -r 0-30000000 "$F" | zcat 2>/dev/null | python3 -c "
          import json, sys
          n = 0
          for line in sys.stdin:
              try:
                  d = json.loads(line)
              except Exception:
                  break
              if 'index' in d:
                  continue
              n += 1
              if n <= 2:
                  print('CLES', sorted(d))
              if n in (1, 2, 40):
                  print('TITRE', d.get('title'), '| pop', d.get('popularity_score'), '| liens', d.get('incoming_links'), '| ns', d.get('namespace'))
                  print('INTRO', (d.get('opening_text') or '')[:400])
                  aux = d.get('auxiliary_text') or []
                  print('AUX', len(aux), [a[:300] for a in aux[:2]])
                  print('TEXTE', len(d.get('text') or ''), (d.get('text') or '')[:200])
                  print('WIKIDATA', d.get('wikibase_item'), '| redirections', len(d.get('redirect') or []), (d.get('redirect') or [])[:3])
          print('documents lus', n)
          "
