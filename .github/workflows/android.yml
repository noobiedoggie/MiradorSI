name: APK Android

on:
  push:
    paths:
      - "android/**"
      - "miradorsi/**"
      - "config/identity.toml"
      - "data/lexique_fr.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Construire l'APK de Mirador SI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy utilise un Python de la même version sur la machine de compilation.
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Embarquer le code Python de Mirador SI
        run: android/prepare_python.sh

      - name: Compiler l'APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/debug/app-debug.apk sortie/MiradorSI.apk
          ls -la sortie

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MiradorSI-apk
          path: sortie/MiradorSI.apk
          if-no-files-found: error

  emulateur:
    name: Tester Mirador SI sur un émulateur Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Embarquer le code Python de Mirador SI
        run: android/prepare_python.sh

      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer les tests sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            gradle -p android installDebug
            adb shell am start -n com.miradorsi.app/.MainActivity
            sleep 20
            adb exec-out screencap -p > capture-accueil.png
            gradle -p android connectedDebugAndroidTest --stacktrace

      - name: Capture d'écran de l'accueil
        if: always()
        run: |
          if [ -f capture-accueil.png ]; then
            pip install --quiet pillow
            python3 - <<'PY'
          import base64, io
          from PIL import Image
          image = Image.open("capture-accueil.png").convert("RGB")
          image.thumbnail((300, 660))
          tampon = io.BytesIO()
          image.save(tampon, "JPEG", quality=60)
          print("CAPTURE_JPEG_BASE64:" + base64.b64encode(tampon.getvalue()).decode())
          PY
          fi

      - name: Publier la capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-accueil
          path: capture-accueil.png
          if-no-files-found: ignore

      - name: Résumé des tests
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          fichiers = glob.glob("android/app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          total = echecs = 0
          print("### Tests Mirador SI sur émulateur Android\n")
          for f in fichiers:
              for cas in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  rate = cas.find("failure") is not None or cas.find("error") is not None
                  echecs += rate
                  print(f"- {'❌' if rate else '✅'} {cas.get('name')} ({float(cas.get('time', 0)):.1f} s)")
                  for balise in ("failure", "error"):
                      detail = cas.find(balise)
                      if detail is not None:
                          print("  > " + " ".join((detail.text or detail.get("message") or "").split())[:400])
          print(f"\n**{total - echecs}/{total} tests réussis**")
          PY

      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-emulateur
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  # Une fois les tests passés, l'APK est publié en « release » : lien direct, sans compte GitHub
  # ni archive zip : https://github.com/<dépôt>/releases/latest/download/MiradorSI.apk
  publier:
    name: Publier l'APK testé
    needs: [apk, emulateur]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publier-apk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiradorSI-apk

      - name: Remplacer la release « apk »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la MiradorSI.apk
          cat > notes.md <<EOF
          APK Android de Mirador SI, compilé et testé sur un émulateur Android 11 par GitHub Actions
          (commit ${GITHUB_SHA::7}).

          **Installer** : ouvrir MiradorSI.apk sur le téléphone, puis autoriser l'installation
          d'applications de cette source quand Android le demande. Android 8.0 ou plus récent.
          EOF
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk MiradorSI.apk --target "$GITHUB_SHA" --latest \
            --title "Mirador SI — APK Android" --notes-file notes.md
