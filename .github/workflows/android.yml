name: APK Android

on:
  push:
    paths:
      - "android/**"
      - "miradorsi/**"
      - "config/identity.toml"
      - "data/lexique_fr.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Construire l'APK de Mirador SI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy utilise un Python de la même version sur la machine de compilation.
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Embarquer le code Python de Mirador SI
        run: |
          P=android/app/src/main/python
          rm -rf "$P/miradorsi"
          cp -r miradorsi "$P/"
          find "$P/miradorsi" -name "__pycache__" -type d -prune -exec rm -rf {} +
          cp config/identity.toml "$P/mirador_app/config/identity.toml"
          cp data/lexique_fr.json "$P/mirador_app/data/lexique_fr.json"
          ls -la "$P/mirador_app/modele"

      - name: Compiler l'APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/debug/app-debug.apk sortie/MiradorSI.apk
          ls -la sortie

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MiradorSI-apk
          path: sortie/MiradorSI.apk
          if-no-files-found: error
